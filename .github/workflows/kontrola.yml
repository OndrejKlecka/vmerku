# Kontrola kódu při každém pushi. Nenasazuje — nasazení řeší Cloudflare
# Workers Builds přímo z repozitáře (viz README, sekce Nasazení na Cloudflare).
name: Kontrola

on:
  push:
  workflow_dispatch:

jobs:
  kontrola:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
