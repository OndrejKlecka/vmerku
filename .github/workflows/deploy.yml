# Nasazení na Cloudflare. Běží na GitHubu, takže k němu není potřeba nic
# instalovat na vlastní počítač – stačí commit do větve main.
#
# Předtím jednou nastav v repozitáři (Settings → Secrets and variables →
# Actions → New repository secret):
#   CLOUDFLARE_API_TOKEN   token s právy Workers Scripts:Edit, D1:Edit,
#                          Containers:Edit a Account Settings:Read
#   CLOUDFLARE_ACCOUNT_ID  ID účtu z pravého sloupce dashboardu
name: Nasazení na Cloudflare

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: nasazeni
  cancel-in-progress: false

jobs:
  nasadit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # Ať se na Cloudflare nedostane něco, co ani neprojde překladem.
      - run: npm run typecheck
      - run: npm test

      # Schéma databáze ze stejných SQL souborů, které používá drizzle-kit.
      - name: Schéma do D1
        run: npx wrangler d1 migrations apply vmerku --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # Wrangler sám postaví obraz z Dockerfile a nahraje ho do registru
      # Cloudflare; Docker je na runneru předinstalovaný.
      - name: Worker a kontejner
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
